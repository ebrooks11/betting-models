name: Daily odds snapshot

on:
  schedule:
    # 13:07 UTC ≈ 9:07 AM ET during EDT (now) / 8:07 AM ET during EST
    # (~Nov 1 onward) — GitHub Actions cron is always UTC and does not
    # shift for daylight saving.
    #
    # Deliberately NOT :00 — GitHub's own docs warn that the schedule
    # event is delayed most at "the start of every hour," since every
    # scheduled workflow on GitHub fires into that same queue at once.
    # Confirmed this in practice: with "0 13 * * *", two scheduled runs
    # landed 4-5 hours late (17:48 and 16:54 UTC instead of 13:00), and a
    # third tick was dropped entirely — GitHub does not retroactively
    # run a missed schedule tick. Picking an off-the-hour minute is
    # GitHub's own recommended mitigation.
    - cron: "7 13 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch odds snapshot and append to Google Sheet
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python3 pipeline/fetch_odds_snapshot.py
