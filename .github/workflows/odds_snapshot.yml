name: Daily odds snapshot

on:
  schedule:
    # Target: 8:07am ET daily (the extra 7 minutes is deliberate — see
    # below). GitHub Actions cron is always UTC and doesn't shift for
    # daylight saving, so this needs a manual flip twice a year:
    #   12:07 UTC = 8:07am EDT — now through ~Nov 1, 2026
    #   13:07 UTC = 8:07am EST — ~Nov 1, 2026 onward
    # (see .github/workflows/injury_reports_sync.yml for a version of
    # this schedule that lists both UTC equivalents permanently instead
    # of needing this manual flip — not done here because that pattern
    # means firing twice a day, once "right" and once an hour off, which
    # is harmless for injury reports' change-detection logic but would
    # mean two odds snapshots on the "wrong" days instead of one.)
    #
    # Deliberately NOT :00 — GitHub's own docs warn that the schedule
    # event is delayed most at "the start of every hour," since every
    # scheduled workflow on GitHub fires into that same queue at once.
    # Confirmed this in practice: with "0 13 * * *", two scheduled runs
    # landed 4-5 hours late (17:48 and 16:54 UTC instead of 13:00), and a
    # third tick was dropped entirely — GitHub does not retroactively
    # run a missed schedule tick. Picking an off-the-hour minute is
    # GitHub's own recommended mitigation.
    - cron: "7 12 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch odds snapshot and append to Google Sheet
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python3 pipeline/fetch_odds_snapshot.py
