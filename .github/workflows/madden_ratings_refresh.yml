name: Madden ratings refresh

on:
  schedule:
    # Thursday 7:07pm ET. Checked directly (2026-11-19, web search): EA
    # doesn't publish an official schedule, and the ratings page itself
    # carries no publish-timestamp field (only iteration.id/label — see
    # fetch_madden_ratings.py) — but multiple third-party Madden-roster
    # trackers (ClutchPoints, Timesaver) consistently report weekly roster
    # updates land on THURSDAYS during the season, "Thursday afternoon ET,
    # before Thursday Night Football." 7:07pm ET is chosen to land after
    # that reported afternoon window but before TNF's ~8:15pm ET kickoff.
    # This supersedes an earlier version of this file that guessed Tuesday
    # (offset from weekly_stats_refresh.yml) with no real sourcing at all.
    # Still just third-party reporting, not an EA-confirmed schedule, so
    # could be off by a day some weeks — low-risk either way, since
    # pipeline/fetch_madden_ratings.py's build() is idempotent (a no-op if
    # the current iteration is already captured): running early just means
    # this run no-ops and the following Thursday's run catches the new
    # iteration instead, nothing duplicates or breaks. Not :00 — see
    # odds_snapshot.yml's cron comment for why. Both DST equivalents are
    # listed permanently, same pattern as injury_reports_sync.yml/
    # weekly_stats_refresh.yml.
    - cron: "7 23 * * 4"  # 7:07pm EDT (now through ~Nov 1, 2026)
    - cron: "7 0 * * 5"   # 7:07pm EST (~Nov 1, 2026 onward) -> Fri 00:07 UTC
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed to commit the refreshed madden_ratings.parquet/matchups.json

jobs:
  refresh-madden-ratings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch current Madden ratings
        run: python3 pipeline/fetch_madden_ratings.py

      - name: Regenerate matchups.json
        run: python3 pipeline/generate_matchups_table.py

      - name: Commit and push if anything changed
        # data/madden_ratings.parquet is a tracked exception to data/'s
        # usual gitignore (see .gitignore), same pattern as every other
        # accumulating source this pipeline keeps in the repo.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/madden_ratings.parquet docs/data/matchups.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly refresh: Madden ratings"
            git push
          fi
