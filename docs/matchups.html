<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Model · Matchups</title>
<style>
/* ── Tokens (matches site palette) ─────────────────────────── */
:root {
  --bg:         #f0f2f7;
  --surface:    #ffffff;
  --surface-2:  #f5f7fc;
  --surface-3:  #eaecf4;
  --border:     #d8dce8;
  --border-hi:  #b8c0d4;
  --text:       #1a2035;
  --text-muted: #5a6480;
  --text-dim:   #9aa0b4;
  --accent:     #d4890a;
  --accent-dim: rgba(212,137,10,.1);
  --good:       #1e9e6e;
  --good-dim:   rgba(30,158,110,.12);
  --bad:        #cc3a3a;
  --bad-dim:    rgba(204,58,58,.10);
  --neutral:    #7080a0;
  --font-mono:  "JetBrains Mono","Fira Code","Cascadia Code",ui-monospace,monospace;
  --font-sans:  -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --font-cond:  "Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --r:          5px;
  --r-lg:       9px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0d1117; --surface:#161b22; --surface-2:#1e242e; --surface-3:#252c38;
    --border:#2a3140; --border-hi:#3a4458; --text:#e2e8f4; --text-muted:#6b7a99;
    --text-dim:#4a5568; --accent:#f0a500; --accent-dim:rgba(240,165,0,.12);
    --good:#3fb68a; --good-dim:rgba(63,182,138,.15);
    --bad:#e05656; --bad-dim:rgba(224,86,86,.13); --neutral:#5a7099;
  }
}
:root[data-theme="dark"] {
  --bg:#0d1117; --surface:#161b22; --surface-2:#1e242e; --surface-3:#252c38;
  --border:#2a3140; --border-hi:#3a4458; --text:#e2e8f4; --text-muted:#6b7a99;
  --text-dim:#4a5568; --accent:#f0a500; --accent-dim:rgba(240,165,0,.12);
  --good:#3fb68a; --good-dim:rgba(63,182,138,.15);
  --bad:#e05656; --bad-dim:rgba(224,86,86,.13); --neutral:#5a7099;
}

/* ── Reset ──────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { font-family: var(--font-sans); background: var(--bg); color: var(--text); min-height: 100vh; }
button, input, select { font-family: inherit; }
button { cursor: pointer; }

/* ── Page shell ─────────────────────────────────────────────── */
.page { max-width: 1400px; margin: 0 auto; padding: 22px 20px 60px; }

/* ── Header ─────────────────────────────────────────────────── */
.site-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; margin-bottom: 18px; padding-bottom: 16px;
  border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.site-title {
  font-family: var(--font-cond); font-size: 1.25rem; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase; color: var(--text);
}
.site-title span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 8px; }
.nav-link, .theme-toggle {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--r); color: var(--text-muted); font-size: .72rem;
  padding: 4px 10px; line-height: 1; text-decoration: none; display: inline-block;
}
.nav-link:hover, .theme-toggle:hover { color: var(--text); border-color: var(--border-hi); }

/* ── Week picker ────────────────────────────────────────────── */
.week-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.week-chip {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); color: var(--text-muted); cursor: pointer;
  font-family: var(--font-cond); font-size: .85rem; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase; padding: 8px 20px;
}
.week-chip:hover { color: var(--text); border-color: var(--border-hi); }
.week-chip.selected { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

/* ── Game cards ─────────────────────────────────────────────── */
.games-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
.game-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.game-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border);
}
.game-matchup { font-family: var(--font-cond); font-size: 1.1rem; font-weight: 700; letter-spacing: .03em; }
.game-time { font-size: .7rem; color: var(--text-muted); font-family: var(--font-mono); }

.lines-row {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  padding: 7px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border);
  font-family: var(--font-mono); font-size: .7rem; color: var(--text);
}
.lines-row .book-tag { color: var(--text-dim); font-size: .62rem; text-transform: uppercase; letter-spacing: .04em; }
.no-lines { text-align: center; padding: 6px 16px; font-size: .66rem; color: var(--text-dim);
  font-style: italic; background: var(--surface-2); border-bottom: 1px solid var(--border); }
/* A line "hit" (winning moneyline side, the team that covered, the
   actual over/under result) once the game's final score is in — see
   betResults() in the script below. Under gets its own color (not the
   same green as a cover/moneyline win or an Over) so "the total went
   under" doesn't read as equivalent to "this side hit." */
.line-hit { color: var(--good); font-weight: 700; }
.line-under { color: var(--accent); font-weight: 700; }
.line-push { color: var(--text-dim); font-weight: 600; }

.final-row {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 7px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border);
  font-family: var(--font-mono); font-size: .78rem; color: var(--text-dim);
}
.final-tag {
  font-size: .58rem; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim);
  border: 1px solid var(--border); border-radius: 20px; padding: 1px 7px;
}
.final-winner { color: var(--text); font-weight: 700; }

.form-strip { display: flex; gap: 3px; }
.form-card {
  flex: 1; min-width: 0; text-align: center; border-radius: var(--r);
  padding: 2px 1px 3px; font-family: var(--font-mono); line-height: 1.3;
}
.form-card .form-result { font-size: .62rem; font-weight: 800; }
.form-card .form-score { font-size: .58rem; font-weight: 600; color: var(--text); }
.form-card .form-opp {
  font-size: .52rem; color: var(--text-dim); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.form-w { background: var(--good-dim); }
.form-w .form-result { color: var(--good); }
.form-l { background: var(--bad-dim); }
.form-l .form-result { color: var(--bad); }
.form-t { background: var(--surface-3); }
.form-t .form-result { color: var(--text-dim); }

/* ATS and O/U each get their own labeled row of pills (not nested inside
   the result card) so a trend across the last 5 games — all covers, a
   string of overs, etc. — reads left-to-right at a glance instead of
   requiring opening each card individually. */
.form-row-label {
  font-size: .52rem; color: var(--text-dim); text-transform: uppercase;
  letter-spacing: .05em; font-family: var(--font-mono); margin: 5px 0 2px;
}
.form-pill-row { display: flex; gap: 3px; margin-bottom: 4px; }
.form-pill-row:last-child { margin-bottom: 9px; }
.form-pill {
  flex: 1; min-width: 0; text-align: center; border-radius: var(--r);
  padding: 3px 1px; font-family: var(--font-mono); font-size: .56rem;
  font-weight: 800; text-transform: uppercase; letter-spacing: .01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.form-pill.form-hit { background: var(--good-dim); color: var(--good); }
.form-pill.form-under { background: var(--accent-dim); color: var(--accent); }
.form-pill.form-miss { background: var(--bad-dim); color: var(--bad); }
.form-pill.form-push { background: var(--surface-3); color: var(--text-dim); }

.game-body { display: grid; grid-template-columns: 1fr 1fr; }
/* min-width: 0 overrides the grid item default (min-width: auto), which
   otherwise refuses to shrink a column below its content's intrinsic
   width — e.g. a long unbroken injury-row line — and silently pushes the
   second (right-hand/home) column out past the card's edge, where
   .game-card's overflow: hidden then clips it instead of wrapping it. */
.team-col { padding: 10px 14px; min-width: 0; }
.team-col + .team-col { border-left: 1px solid var(--border); }
.team-col-head {
  font-family: var(--font-cond); font-weight: 700; font-size: .85rem;
  letter-spacing: .04em; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase;
}

.compare-wrap { padding: 10px 16px 8px; border-bottom: 1px solid var(--border); }
.compare-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: .74rem; }
.compare-table th {
  font-size: .58rem; letter-spacing: .05em; text-transform: uppercase;
  color: var(--text-dim); font-weight: 600; text-align: right; padding: 2px 10px 4px;
}
.compare-table th.compare-team-cell, .compare-table td.compare-team-cell {
  text-align: left; font-family: var(--font-cond); font-weight: 700;
  letter-spacing: .03em; color: var(--text-muted); text-transform: uppercase; padding-right: 14px;
}
.compare-table td { text-align: right; padding: 4px 10px; font-weight: 700; color: var(--text); border-radius: var(--r); }
.compare-table td.compare-better { background: var(--good-dim); color: var(--good); }
.compare-note { font-size: .6rem; color: var(--text-dim); font-family: var(--font-mono); margin-top: 4px; }
.compare-record { font-weight: 600; color: var(--text-dim); text-transform: none; letter-spacing: 0; margin-left: 4px; }
.healthy-note { font-size: .62rem; font-weight: 600; color: var(--text-dim); }

.staff-table th, .staff-table td { text-align: left; }
.staff-table td { font-weight: 600; }

.staff-list { font-size: .68rem; color: var(--text-muted); margin-bottom: 10px; line-height: 1.6; }
.staff-item { display: block; }
.staff-label { display: inline-block; width: 26px; font-family: var(--font-mono); font-size: .6rem; color: var(--text-dim); }
.staff-name { color: var(--text); }
.stale-tag { color: var(--text-dim); font-size: .58rem; margin-left: 3px; }

.sub-head {
  font-size: .6rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-dim); font-family: var(--font-mono); margin: 10px 0 4px;
  padding-top: 8px; border-top: 1px solid var(--border);
}
.sub-head:first-child { margin-top: 0; padding-top: 0; border-top: none; }
.inactive-dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--bad); margin-right: 5px; vertical-align: middle;
}
.inj-player { font-weight: 600; }
.inj-pos { color: var(--text-dim); font-family: var(--font-mono); font-size: .68rem; margin-left: 4px; }
.status-badge {
  font-family: var(--font-mono); font-size: .6rem; letter-spacing: .04em; text-transform: uppercase;
  padding: 1px 7px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
}
.status-out, .status-doubtful { background: var(--bad-dim); color: var(--bad); }
.status-reserve { background: var(--surface-3); color: var(--text-dim); }
.empty-note { color: var(--text-dim); font-size: .7rem; font-style: italic; }

.madden-badge {
  font-family: var(--font-mono); font-weight: 700; font-size: .68rem;
  color: var(--accent); background: var(--accent-dim);
  padding: 1px 6px; border-radius: 20px; margin-left: 6px; white-space: nowrap;
}
/* Every injury row gets this same single-line treatment now — no
   starter/compact distinction (see renderInjuryRow). */
.inj-row {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 2px 0;
  font-size: .68rem; border-bottom: 1px solid var(--border);
}
.inj-row:last-child { border-bottom: none; }
.inj-name { flex-shrink: 0; max-width: 100%; white-space: nowrap; }
.inj-detail {
  color: var(--text-dim); font-size: .64rem; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Positional-count summary (see renderPositionSummary) — a quick "what's
   actually hurting this team" read before the individual rows, and each
   pill doubles as a filter for that team's list (see togglePositionFilter). */
.pos-summary { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-bottom: 6px; }
.pos-count-badge {
  font-family: var(--font-mono); font-weight: 700; font-size: .62rem;
  color: var(--text-muted); background: var(--surface-3);
  padding: 1px 7px; border-radius: 20px; white-space: nowrap;
  border: 1px solid transparent; cursor: pointer;
}
.pos-count-badge:hover { color: var(--text); border-color: var(--border-hi); }
.pos-count-badge.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

/* Full-season schedule (see renderFullSchedule) — collapsed by default
   via the native <details> element, no JS state needed to track it. */
.schedule-details { margin-top: 10px; }
.schedule-summary {
  cursor: pointer; user-select: none;
}
.schedule-summary:hover { color: var(--text); }
.schedule-list { margin-top: 6px; }
.sched-row {
  display: flex; align-items: baseline; gap: 8px; padding: 2px 0;
  font-size: .68rem; border-bottom: 1px solid var(--border);
}
.sched-row:last-child { border-bottom: none; }
.sched-wk { font-family: var(--font-mono); color: var(--text-dim); width: 36px; flex-shrink: 0; }
.sched-opp { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sched-result { font-family: var(--font-mono); font-weight: 700; flex-shrink: 0; }
.sched-w { color: var(--good); }
.sched-l { color: var(--bad); }
.sched-t, .sched-pending { color: var(--text-dim); }

.state-msg { text-align: center; padding: 60px 20px; color: var(--text-muted); font-family: var(--font-mono); font-size: .85rem; }
</style>
</head>
<body>
<div class="page">

  <header class="site-header">
    <div class="site-title">NFL <span>MODEL</span> · Matchups</div>
    <div class="header-right">
      <a class="nav-link" href="index.html">← Week View</a>
      <a class="nav-link" href="season.html">Season Rollup</a>
      <a class="nav-link" href="explore.html">Game Explorer</a>
      <a class="nav-link" href="players.html">Player Explorer</a>
      <a class="nav-link" href="coordinators.html">Coordinators</a>
      <button class="theme-toggle" onclick="toggleTheme()">Toggle theme</button>
    </div>
  </header>

  <div class="week-chips" id="week-chips"></div>

  <div id="main-content">
    <div class="state-msg" id="loading-msg">Loading matchups…</div>
  </div>

</div>

<script>
let DATA = null;
let selectedWeek = null;
// {team: posGroup} — which position-pill filter (if any) is active for
// that team's injury list this week. Keyed by team abbreviation rather
// than per-game-card index since a team appears in at most one game per
// week, so this is unambiguous within a single week's view. Reset
// whenever the selected week changes (see buildWeekChips), but NOT when
// a filter pill itself is toggled (see togglePositionFilter).
let positionFilters = {};

function toggleTheme() {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';
}

async function init() {
  try {
    // Always revalidate against GitHub Pages' ETag/Last-Modified rather
    // than trusting a browser-cached copy under this URL — this data
    // changes multiple times a week and a static "?v=1" query string
    // doesn't bust the cache across deploys.
    const res = await fetch('./data/matchups.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    DATA = await res.json();
    selectedWeek = DATA.current_week;
    buildWeekChips();
    render();
  } catch (e) {
    document.getElementById('main-content').innerHTML = `<div class="state-msg">Error loading data: ${e.message}</div>`;
  }
}

function buildWeekChips() {
  const container = document.getElementById('week-chips');
  container.innerHTML = '';
  DATA.weeks.forEach(w => {
    const chip = document.createElement('button');
    chip.className = 'week-chip' + (w === selectedWeek ? ' selected' : '');
    chip.textContent = `Week ${w}`;
    chip.onclick = () => { selectedWeek = w; positionFilters = {}; buildWeekChips(); render(); };
    container.appendChild(chip);
  });
}

// Out/Doubtful get the "bad" color; everything else shown (Inactive
// (healthy/other) and the season-long reserve-list statuses — Injured
// Reserve, IR - Designated to Return, PUP, NFI, Suspended) falls to the
// neutral "reserve" style. Questionable/No designation never reach this —
// renderTeamCol filters them out before rendering (see below).
const STATUS_CLASS = {
  'Out': 'status-out',
  'Doubtful': 'status-doubtful',
};
function statusClass(status) { return STATUS_CLASS[status] || 'status-reserve'; }

// madden_rating comes from the most recent snapshot in
// data/madden_ratings.parquet, joined by (team, name) — see
// generate_matchups_table.py's "Madden rating on injury rows" docstring
// section for why it's null for some players (nickname mismatches, or a
// deep-roster player Madden doesn't rate at all) rather than always present.
function maddenBadge(r) {
  return r.madden_rating != null ? `<span class="madden-badge" title="Madden overall">${r.madden_rating} OVR</span>` : '';
}

// replacement_player/replacement_rating are still computed and present
// in the data (pipeline/team_rating.py's injury_replacements_by_week),
// but not rendered here — a hurt player's listed "replacement" can
// itself be hurt the same week, producing a confusing mutual-replacement
// pair (e.g. two hurt CBs each showing the other as their own
// replacement). See that file's "Per-player replacements" docstring
// "KNOWN FLAW" note; re-add the badge once the substitution logic
// accounts for this.
function renderInjuryRow(r) {
  const detailParts = [];
  if (r.injury) detailParts.push(r.injury);
  if (r.expected_return) detailParts.push(`Return: ${r.expected_return}`);
  const dot = r.game_day_inactive ? '<span class="inactive-dot" title="Inactive"></span>' : '';

  return `
    <div class="inj-row">
      <span class="inj-name">${dot}<span class="inj-player">${r.player}</span><span class="inj-pos">${r.pos || ''}</span>${maddenBadge(r)}</span>
      <span class="inj-detail">${detailParts.join(' · ')}</span>
      <span class="status-badge ${statusClass(r.status)}">${r.status}</span>
    </div>`;
}

// Broad position groups for the "what's actually hurting this team"
// summary at the top of each injury list — built from every pos value
// actually observed in injury_reports.parquet. Offensive line variants
// (center/guard/tackle, plus the injury report's own combo labels like
// "G/T" for a player who plays either) all roll up into one "OL" count,
// since a fantasy manager mostly cares "how many linemen are out," not
// which specific spot. CB and S are kept split out from a generic "DB"
// bucket instead of merged together — corner and safety are different
// enough roles that lumping them would hide which one a team is actually
// short at (a generic "DB" label is used for the rare injury-report row
// that doesn't specify further). Kickers/punters/long snappers roll into
// "ST" for completeness, though they're rarely the headline.
const POS_GROUP = {
  QB: 'QB',
  RB: 'RB', FB: 'RB',
  WR: 'WR',
  TE: 'TE',
  C: 'OL', G: 'OL', T: 'OL', OG: 'OL', OT: 'OL', OL: 'OL',
  'C/G': 'OL', 'G/T': 'OL', 'T/G': 'OL',
  DE: 'DL', DT: 'DL', DL: 'DL', EDGE: 'DL',
  ILB: 'LB', OLB: 'LB', LB: 'LB',
  CB: 'CB',
  S: 'S',
  DB: 'DB',
  K: 'ST', P: 'ST', LS: 'ST',
};

// Counts over the full status-filtered list (see renderTeamCol) —
// deliberately NOT re-filtered by the active position-pill filter, so a
// pill's own count stays stable (and every other pill stays visible and
// clickable) while one of its siblings is selected.
function positionCounts(rows) {
  const counts = {};
  rows.forEach(r => {
    const group = POS_GROUP[r.pos];
    if (!group) return;
    counts[group] = (counts[group] || 0) + 1;
  });
  return Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}

// Clicking a pill filters that team's injury list to just that position
// group; clicking the already-active pill clears it back to "show all"
// (a toggle, not a one-way switch) — see positionFilters' own comment
// for why this is keyed by team rather than by game/column.
function togglePositionFilter(team, pos) {
  positionFilters[team] = positionFilters[team] === pos ? null : pos;
  render();
}

function renderPositionSummary(team, rows) {
  const counts = positionCounts(rows);
  if (!counts.length) return '';
  const active = positionFilters[team];
  const badges = counts.map(([pos, n]) => {
    const isActive = pos === active;
    return `<span class="pos-count-badge${isActive ? ' active' : ''}" title="${isActive ? 'Click to clear filter' : `Filter to ${pos} only`}" onclick="togglePositionFilter('${team}','${pos}')">${pos}: ${n}</span>`;
  }).join('');
  return `<div class="pos-summary">${badges}</div>`;
}

function fmtStat(v, digits, suffix) {
  if (v === null || v === undefined) return '—';
  return v.toFixed(digits) + (suffix || '');
}

function fmtSigned(v) {
  if (v === null || v === undefined) return '—';
  return v > 0 ? `+${v}` : String(v);
}

function fmtOdds(v) {
  if (v === null || v === undefined) return '—';
  return v > 0 ? `+${v}` : String(v);
}

// Order here is display order in the compare table. Add new stats by
// adding an entry — higher is better for all of these today, so there's
// no per-metric "lower is better" flag yet, but that's the obvious next
// thing to add if a metric like turnovers ever joins this list.
//
// Deliberately offense-only (see generate_matchups_table.py's "Team
// season summary" docstring) — point_differential/points_per_game are
// computed and present in the data but intentionally not shown here,
// since both mix in defensive/special-teams scoring via points_allowed/
// points_scored; offensive_points_per_game is the pure-offense
// equivalent used instead. preseason_win_total, roster_rating,
// qb_rating/ol_rating/dl_rating, and power_win_pct are the exceptions —
// none is a per-play offense stat (win total is the market's
// overall-team projection; roster_rating and the three position-group
// ratings are position-weighted-Madden-rating scores, the latter three
// each scoped to one group and on their own 0-100 scale rather than
// roster_rating's points-calibrated one — see pipeline/team_rating.py's
// module docstring for the full system behind all four; power record is
// a whole-team strength-of-schedule-adjusted record — see
// generate_matchups_table.py's "Power record" docstring section), kept
// up front since all six are "at a glance" framing for the matchup
// rather than a per-play offensive rate.
const COMPARE_METRICS = [
  { key: 'preseason_win_total', label: 'Win Total', fmt: v => v != null ? v.toFixed(1) : '—' },
  // roster_rating_healthy is the same stat with the current week's
  // injury substitution skipped (see pipeline/team_rating.py's "Healthy
  // roster rating" docstring section) — shown alongside roster_rating
  // itself only when it actually differs (a fully healthy team has
  // nothing extra to show), so a team's current injury cost reads at a
  // glance without a whole extra compare-table row.
  { key: 'roster_rating', label: 'Roster Rating', fmt: (v, row) => {
      if (v == null) return '—';
      const healthy = row.roster_rating_healthy;
      if (healthy != null && Math.abs(healthy - v) > 0.05) {
        return `${v.toFixed(1)} <span class="healthy-note" title="Roster Rating if fully healthy">(${healthy.toFixed(1)} healthy)</span>`;
      }
      return v.toFixed(1);
    } },
  { key: 'qb_rating', label: 'QB Rating', fmt: v => v != null ? v.toFixed(1) : '—' },
  { key: 'ol_rating', label: 'OL Rating', fmt: v => v != null ? v.toFixed(1) : '—' },
  { key: 'dl_rating', label: 'DL Rating', fmt: v => v != null ? v.toFixed(1) : '—' },
  { key: 'power_win_pct', label: 'Power Record', fmt: (v, row) => row.power_wins_full != null ? `${row.power_wins_full}-${row.power_losses_full}` : '—' },
  { key: 'success_rate', label: 'Success Rate', fmt: v => v != null ? (v * 100).toFixed(0) + '%' : '—' },
  { key: 'epa_per_play', label: 'EPA/Play', fmt: v => fmtStat(v, 2) },
  { key: 'early_down_success_rate', label: 'Early Down Success', fmt: v => v != null ? (v * 100).toFixed(0) + '%' : '—' },
  { key: 'offensive_points_per_game', label: 'Off. PPG', fmt: v => v != null ? v.toFixed(1) : '—' },
];

// Season record as of this week (see generate_matchups_table.py's "Team
// season summary" docstring) — '' once a team hasn't had a summary built
// yet at all (wins is null only in that case, not for 0-0 teams, which
// still get "0-0"). Ties are dropped from the label when there aren't
// any, since the modern NFL effectively never has one.
function recordLabel(summary) {
  if (summary.wins == null) return '';
  return summary.ties ? `${summary.wins}-${summary.losses}-${summary.ties}` : `${summary.wins}-${summary.losses}`;
}

function renderCompareRow(team, summary, otherSummary) {
  const cells = COMPARE_METRICS.map(m => {
    const val = summary[m.key];
    const otherVal = otherSummary[m.key];
    const better = val != null && otherVal != null && val > otherVal;
    return `<td class="${better ? 'compare-better' : ''}">${m.fmt(val, summary)}</td>`;
  }).join('');
  return `<tr><td class="compare-team-cell">${team} <span class="compare-record">${recordLabel(summary)}</span></td>${cells}</tr>`;
}

function renderCompareTable(g) {
  const headCells = COMPARE_METRICS.map(m => `<th>${m.label}</th>`).join('');
  const awayGp = g.away_team_summary.games_played;
  const homeGp = g.home_team_summary.games_played;
  return `
    <div class="compare-wrap">
      <table class="compare-table">
        <thead><tr><th class="compare-team-cell"></th>${headCells}</tr></thead>
        <tbody>
          ${renderCompareRow(g.away_team, g.away_team_summary, g.home_team_summary)}
          ${renderCompareRow(g.home_team, g.home_team_summary, g.away_team_summary)}
        </tbody>
      </table>
      <div class="compare-note">${g.away_team} ${awayGp} game${awayGp === 1 ? '' : 's'} · ${g.home_team} ${homeGp} game${homeGp === 1 ? '' : 's'} played this season</div>
    </div>`;
}

function staleTag(season, asOf) {
  if (asOf == null) return '';
  return asOf < season ? `<span class="stale-tag">('${String(asOf).slice(2)})</span>` : '';
}

// Names, not numbers — no "better" highlighting here, just the same
// shared-table layout as the compare table below it for a consistent look.
const STAFF_FIELDS = [
  { key: 'hc_name', asOfKey: 'hc_name_as_of', label: 'HC' },
  { key: 'oc_name', asOfKey: 'oc_name_as_of', label: 'OC' },
  { key: 'dc_name', asOfKey: 'dc_name_as_of', label: 'DC' },
  { key: 'starting_qb', asOfKey: null, label: 'QB' },
];

function renderStaffRow(team, summary) {
  const season = DATA.season;
  const cells = STAFF_FIELDS.map(f => {
    const name = summary[f.key];
    const asOf = f.asOfKey ? summary[f.asOfKey] : (name != null ? season : null);
    return `<td>${name || '—'}${staleTag(season, asOf)}</td>`;
  }).join('');
  return `<tr><td class="compare-team-cell">${team}</td>${cells}</tr>`;
}

function renderStaffTable(g) {
  const headCells = STAFF_FIELDS.map(f => `<th>${f.label}</th>`).join('');
  return `
    <div class="compare-wrap">
      <table class="compare-table staff-table">
        <thead><tr><th class="compare-team-cell"></th>${headCells}</tr></thead>
        <tbody>
          ${renderStaffRow(g.away_team, g.away_team_summary)}
          ${renderStaffRow(g.home_team, g.home_team_summary)}
        </tbody>
      </table>
    </div>`;
}

function resultClass(result) {
  return result === 'W' ? 'form-w' : result === 'L' ? 'form-l' : 'form-t';
}

// Spelled-out labels for this team's own recent_games.covered
// (true/false/"push"/null) and recent_games.total_result
// ("over"/"under"/"push"/null) — see generate_matchups_table.py's
// "Recent form" docstring section for how both are graded. null (no
// line for that game) renders as nothing rather than a vague dash.
function atsLabel(covered) {
  if (covered === true) return { cls: 'form-hit', text: 'Covered' };
  if (covered === false) return { cls: 'form-miss', text: 'No Cover' };
  if (covered === 'push') return { cls: 'form-push', text: 'Push' };
  return null;
}
function totalLabel(totalResult) {
  if (totalResult === 'over') return { cls: 'form-hit', text: 'Over' };
  if (totalResult === 'under') return { cls: 'form-under', text: 'Under' };
  if (totalResult === 'push') return { cls: 'form-push', text: 'Push' };
  return null;
}

function renderFormStrip(recentGames) {
  if (!recentGames || !recentGames.length) return '';
  // recent_games arrives most-recent-first (see generate_matchups_table.py);
  // reversed here so the strip reads oldest-to-newest, left-to-right — the
  // usual "form guide" convention, most recent game on the right.
  const games = [...recentGames].reverse();

  const cards = games.map(r => {
    const loc = r.home_away === 'home' ? '' : '@';
    const title = `Wk ${r.week}${r.season !== DATA.season ? ` '${String(r.season).slice(2)}` : ''}: ` +
      `${r.result} ${r.team_score}-${r.opp_score} ${r.home_away === 'home' ? 'vs' : '@'} ${r.opponent}`;
    return `
      <div class="form-card ${resultClass(r.result)}" title="${title}">
        <div class="form-result">${r.result}</div>
        <div class="form-score">${r.team_score}-${r.opp_score}</div>
        <div class="form-opp">${loc}${r.opponent}</div>
      </div>`;
  }).join('');

  // Own row per metric — not nested inside the result card — so a run of
  // covers or overs across the last 5 games reads as a trend left-to-right,
  // the same way the result row already does.
  const pillRow = (label, items) => `
    <div class="form-row-label">${label}</div>
    <div class="form-pill-row">${items.join('')}</div>`;

  const atsPills = games.map(r => {
    const ats = atsLabel(r.covered);
    const wk = `Wk ${r.week}${r.season !== DATA.season ? ` '${String(r.season).slice(2)}` : ''}`;
    if (!ats) return `<div class="form-pill form-push" title="${wk}: no spread line">—</div>`;
    return `<div class="form-pill ${ats.cls}" title="${wk}: ${ats.text === 'No Cover' ? 'did not cover' : ats.text.toLowerCase()}">${ats.text}</div>`;
  });
  const totalPills = games.map(r => {
    const tot = totalLabel(r.total_result);
    const wk = `Wk ${r.week}${r.season !== DATA.season ? ` '${String(r.season).slice(2)}` : ''}`;
    if (!tot) return `<div class="form-pill form-push" title="${wk}: no total line">—</div>`;
    return `<div class="form-pill ${tot.cls}" title="${wk}: ${tot.text.toLowerCase()}">${tot.text}</div>`;
  });

  return `
    <div class="form-strip">${cards}</div>
    ${pillRow('ATS', atsPills)}
    ${pillRow('O/U', totalPills)}`;
}

function schedResultClass(result) {
  return result === 'W' ? 'sched-w' : result === 'L' ? 'sched-l' : result === 'T' ? 'sched-t' : 'sched-pending';
}

// Full season (full_schedule, see generate_matchups_table.py's "Full
// schedule" docstring section) — every REG game this team has, played or
// not, always the complete slate regardless of which week is selected
// (unlike the last-5 form strip above it). Collapsed by default via the
// native <details> element.
function renderScheduleRow(r) {
  const loc = r.home_away === 'home' ? 'vs' : '@';
  const scoreText = r.result != null ? `${r.result} ${r.team_score}-${r.opp_score}` : '—';
  return `
    <div class="sched-row">
      <span class="sched-wk">Wk ${r.week}</span>
      <span class="sched-opp">${loc} ${r.opponent}</span>
      <span class="sched-result ${schedResultClass(r.result)}">${scoreText}</span>
    </div>`;
}

function renderFullSchedule(fullSchedule) {
  if (!fullSchedule || !fullSchedule.length) return '';
  return `
    <details class="schedule-details">
      <summary class="sub-head schedule-summary">Full Schedule</summary>
      <div class="schedule-list">${fullSchedule.map(renderScheduleRow).join('')}</div>
    </details>`;
}

function renderTeamCol(team, summary, injuries) {
  // No frontend re-sort — generate_matchups_table.py's _team_injuries
  // already orders this list (inactive-in-any-way first, then Madden
  // rating descending, then snap_share descending, then name; see that
  // file's "Injury ordering" docstring section). Questionable/No
  // designation players are still in the underlying data (and still
  // factor into likely_starter/sorting upstream) but aren't shown here —
  // this page only wants players who are actually not expected to play.
  const rows = injuries.filter(r => r.status !== 'Questionable' && r.status !== 'No designation');

  let html = `<div class="team-col-head">${team}</div>`;
  html += renderFormStrip(summary.recent_games);
  html += `<div class="sub-head">Injuries</div>`;
  if (!rows.length) {
    html += `<div class="empty-note">No injuries reported</div>`;
  } else {
    html += renderPositionSummary(team, rows);
    // The position-pill filter (if any) only narrows what's LISTED below
    // the pills — positionCounts/renderPositionSummary above already ran
    // on the full `rows`, so every pill (including ones at 0 matches once
    // filtered) stays visible and clickable regardless of which one is active.
    const activeFilter = positionFilters[team];
    const displayRows = activeFilter ? rows.filter(r => POS_GROUP[r.pos] === activeFilter) : rows;
    html += displayRows.length
      ? displayRows.map(renderInjuryRow).join('')
      : `<div class="empty-note">No ${activeFilter} injuries</div>`;
  }
  html += renderFullSchedule(summary.full_schedule);
  return html;
}

// Once the game has a final score, tells which side of each line actually
// hit: moneylineWinner/spreadCover are 'home'/'away'/'push', totalResult is
// 'over'/'under'/'push'. null (not just the individual fields) when the
// game hasn't been played yet or there's no line to grade against.
function betResults(g) {
  const f = g.final, l = g.lines;
  if (!f || !l) return null;
  const homeMargin = f.home_score - f.away_score;
  const moneylineWinner = homeMargin > 0 ? 'home' : homeMargin < 0 ? 'away' : 'push';

  let spreadCover = null;
  if (l.home_spread != null) {
    const covered = homeMargin + l.home_spread;
    spreadCover = covered > 0 ? 'home' : covered < 0 ? 'away' : 'push';
  }

  const actualTotal = f.home_score + f.away_score;
  let totalResult = null;
  if (l.total_point != null) {
    totalResult = actualTotal > l.total_point ? 'over' : actualTotal < l.total_point ? 'under' : 'push';
  }

  return { moneylineWinner, spreadCover, totalResult, actualTotal };
}

function renderLinesRow(g) {
  const l = g.lines;
  if (!l) return `<div class="no-lines">Line not yet available</div>`;
  const bets = betResults(g);

  const mlCls = side => (bets && bets.moneylineWinner === side) ? 'line-hit' : '';
  const spCls = side => (bets && bets.spreadCover === side) ? 'line-hit' : '';
  const spreadPush = (bets && bets.spreadCover === 'push') ? ' <span class="line-push">PUSH</span>' : '';

  let totalStr = `O/U ${l.total_point != null ? l.total_point : '—'}`;
  if (bets && bets.totalResult) {
    const cls = bets.totalResult === 'push' ? 'line-push' : bets.totalResult === 'under' ? 'line-under' : 'line-hit';
    totalStr += ` <span class="${cls}">(${bets.actualTotal} ${bets.totalResult.toUpperCase()})</span>`;
  }

  return `
    <div class="lines-row">
      <span><span class="${mlCls('away')}">${g.away_team} ${fmtOdds(l.away_moneyline)}</span> / <span class="${mlCls('home')}">${g.home_team} ${fmtOdds(l.home_moneyline)}</span></span>
      <span><span class="${spCls('away')}">${g.away_team} ${fmtSigned(l.away_spread)} (${fmtOdds(l.away_spread_price)})</span> / <span class="${spCls('home')}">${g.home_team} ${fmtSigned(l.home_spread)} (${fmtOdds(l.home_spread_price)})</span>${spreadPush}</span>
      <span>${totalStr}</span>
      <span class="book-tag">${l.bookmaker}</span>
    </div>`;
}

function renderFinalRow(g) {
  const f = g.final;
  if (!f) return '';
  const awayCls = f.away_score > f.home_score ? 'final-winner' : '';
  const homeCls = f.home_score > f.away_score ? 'final-winner' : '';
  return `
    <div class="final-row">
      <span class="final-tag">Final</span>
      <span class="${awayCls}">${g.away_team} ${f.away_score}</span>
      <span>–</span>
      <span class="${homeCls}">${g.home_team} ${f.home_score}</span>
    </div>`;
}

function renderGameCard(g) {
  return `
    <div class="game-card">
      <div class="game-head">
        <div class="game-matchup">${g.away_team} @ ${g.home_team}</div>
        <div class="game-time">${g.game_date} · ${g.kickoff_et} ET</div>
      </div>
      ${renderFinalRow(g)}
      ${renderLinesRow(g)}
      ${renderStaffTable(g)}
      ${renderCompareTable(g)}
      <div class="game-body">
        <div class="team-col">${renderTeamCol(g.away_team, g.away_team_summary, g.away_injuries)}</div>
        <div class="team-col">${renderTeamCol(g.home_team, g.home_team_summary, g.home_injuries)}</div>
      </div>
    </div>`;
}

function render() {
  const games = DATA.games_by_week[String(selectedWeek)] || [];
  if (!games.length) {
    document.getElementById('main-content').innerHTML = `<div class="state-msg">No games for Week ${selectedWeek}</div>`;
    return;
  }
  document.getElementById('main-content').innerHTML =
    `<div class="games-grid">${games.map(renderGameCard).join('')}</div>`;
}

init();
</script>
</body>
</html>
